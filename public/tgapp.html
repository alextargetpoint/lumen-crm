<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<title>Lumen · Чаты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b12; --panel:#111a2b; --panel2:#18233a; --glass:rgba(17,26,43,.7);
    --ink:#eef3fb; --mut:#7e8ca6; --line:rgba(255,255,255,.08);
    --acc:#3b74ff; --acc2:#78a2ff; --grad:linear-gradient(135deg,#3b74ff,#1d34d8);
    --out:linear-gradient(135deg,#2a5bdd,#1d34d8); --in:#18233a; --ok:#38d18a; --danger:#ff5b52;
    --sh:0 10px 34px rgba(0,0,0,.42); --shacc:0 6px 20px rgba(0,0,0,.35);   /* нейтральная тень (было синее свечение) */
  }
  /* ── СВЕТЛАЯ ТЕМА ── */
  :root[data-theme="light"]{
    --bg:#eef2f8; --bg2:#e6ecf6; --panel:#ffffff; --panel2:#f1f5fb; --glass:rgba(255,255,255,.8);
    --ink:#0f1a2e; --mut:#64748b; --line:rgba(15,26,46,.1);
    --in:#ffffff; --sh:0 8px 26px rgba(16,32,70,.12);
  }
  /* ── ПРЕМИУМ-СТИЛИ CRM (синхрон с десктопом): светлое семейство, свой акцент/бренд-цвет ── */
  :root[data-theme="atelier"]{  /* тихая роскошь: крем + уголь */
    --bg:#f3f1ec; --bg2:#eae7df; --panel:#faf9f5; --panel2:#f1efe9; --glass:rgba(250,249,245,.82);
    --ink:#141311; --mut:#8b8983; --line:rgba(20,19,17,.1);
    --acc:#1a1815; --acc2:#57544e; --grad:linear-gradient(135deg,#2a2620,#141311); --out:linear-gradient(135deg,#26221c,#141311);
    --in:#faf9f5; --sh:0 10px 30px rgba(20,19,17,.1); --shacc:0 8px 22px rgba(20,19,17,.28);
  }
  :root[data-theme="burgundy"]{ /* бордо-бренд, светлый workspace */
    --bg:#f7f3f4; --bg2:#efe7e9; --panel:#ffffff; --panel2:#f6eef0; --glass:rgba(255,255,255,.82);
    --ink:#42121f; --mut:#8a6b73; --line:rgba(134,28,60,.13);
    --acc:#861c3c; --acc2:#b04a63; --grad:linear-gradient(135deg,#9d2646,#6e1330); --out:linear-gradient(135deg,#8f2140,#6e1330);
    --in:#ffffff; --sh:0 10px 30px rgba(66,18,31,.12); --shacc:0 8px 22px rgba(134,28,60,.32);
  }
  :root[data-theme="glass"]{    /* атмосферное стекло, premium-OS */
    --bg:#eef5ff; --bg2:#e4eefc; --panel:#ffffff; --panel2:#eff5ff; --glass:rgba(255,255,255,.78);
    --ink:#0a1930; --mut:#5a6b8c; --line:rgba(57,123,255,.14);
    --acc:#397bff; --acc2:#79a4ff; --grad:linear-gradient(135deg,#397bff,#1f4fd0); --out:linear-gradient(135deg,#2f6cf0,#1f4fd0);
    --in:#ffffff; --sh:0 10px 30px rgba(10,25,48,.12); --shacc:0 8px 22px rgba(57,123,255,.34);
  }
  :root[data-theme="mono"]{     /* чёрно-белый минимализм */
    --bg:#f6f6f6; --bg2:#ededed; --panel:#ffffff; --panel2:#f3f3f3; --glass:rgba(255,255,255,.82);
    --ink:#0d0d0d; --mut:#6b6b6b; --line:rgba(0,0,0,.12);
    --acc:#171717; --acc2:#555555; --grad:linear-gradient(135deg,#2a2a2a,#0d0d0d); --out:linear-gradient(135deg,#242424,#0d0d0d);
    --in:#ffffff; --sh:0 10px 30px rgba(0,0,0,.1); --shacc:0 8px 22px rgba(0,0,0,.3);
  }
  /* хелперы светлого семейства — общие для light + премиум-стилей CRM */
  :root[data-theme="light"] #bgart,:root[data-theme="atelier"] #bgart,:root[data-theme="burgundy"] #bgart,:root[data-theme="glass"] #bgart,:root[data-theme="mono"] #bgart{opacity:.04}
  :root[data-theme="light"] .b.in,:root[data-theme="atelier"] .b.in,:root[data-theme="burgundy"] .b.in,:root[data-theme="glass"] .b.in,:root[data-theme="mono"] .b.in{border:1px solid var(--line)}
  :root[data-theme="light"] .b.in .vp .wave i,:root[data-theme="atelier"] .b.in .vp .wave i,:root[data-theme="burgundy"] .b.in .vp .wave i,:root[data-theme="glass"] .b.in .vp .wave i,:root[data-theme="mono"] .b.in .vp .wave i{background:rgba(15,26,46,.18)}
  :root[data-theme="light"] .b.in .vp .wave i.on,:root[data-theme="atelier"] .b.in .vp .wave i.on,:root[data-theme="burgundy"] .b.in .vp .wave i.on,:root[data-theme="glass"] .b.in .vp .wave i.on,:root[data-theme="mono"] .b.in .vp .wave i.on{background:var(--acc)}
  :root[data-theme="light"] .b.in .doc .ic,:root[data-theme="atelier"] .b.in .doc .ic,:root[data-theme="burgundy"] .b.in .doc .ic,:root[data-theme="glass"] .b.in .doc .ic,:root[data-theme="mono"] .b.in .doc .ic{background:var(--panel2)}
  :root[data-theme="light"] .qchip,:root[data-theme="light"] .quoted,:root[data-theme="atelier"] .qchip,:root[data-theme="atelier"] .quoted,:root[data-theme="burgundy"] .qchip,:root[data-theme="burgundy"] .quoted,:root[data-theme="glass"] .qchip,:root[data-theme="glass"] .quoted,:root[data-theme="mono"] .qchip,:root[data-theme="mono"] .quoted{background:var(--panel2)}
  .b.out{color:#fff}   /* исходящие всегда белым текстом на акценте (все темы) */
  /* акцентная система (violet/green/orange) убрана — только фирменная стилистика церемонки (тема задаёт --acc) */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  /* курсор ввода — по теме (был белый → на кремовом фоне Ателье сливался) */
  input,textarea{caret-color:var(--acc)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Manrope',-apple-system,SF Pro Text,Roboto,Segoe UI,sans-serif;font-size:15px;line-height:1.42;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
  /* компактнее на ~18%: интерфейс был крупноват — равномерное полностраничное уменьшение */
  body{zoom:.82}
  #bgart{position:fixed;inset:0;z-index:0;background:url(/assets/tgapp-bg.png) top center/cover no-repeat;opacity:.3;filter:grayscale(1)}   /* grayscale — убирает неоновую цветную дымку */
  #bgart::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,18,.35),var(--bg) 78%)}
  #app{height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto;position:relative;overflow:hidden;z-index:1}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:0}
  .ic{display:inline-flex;align-items:center;justify-content:center}
  .ic svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic.fill svg{fill:currentColor;stroke:none}
  /* ---------- ЛИСТ ---------- */
  #view-list{height:100%;display:flex;flex-direction:column;animation:fade .3s}
  .top{padding:calc(env(safe-area-inset-top) + 15px) 16px 10px;position:sticky;top:0;z-index:5;
    background:linear-gradient(180deg,var(--bg) 55%,transparent);backdrop-filter:blur(10px)}
  .top h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}
  .top h1 .spark{width:28px;height:28px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--shacc);color:#fff;font-size:15px}
  .top .sub{color:var(--mut);font-size:12.5px;margin-top:4px;font-weight:600}
  .search{margin:11px 0 2px;position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:11px 14px 11px 40px;font-size:14.5px;outline:none;transition:.2s;font-family:inherit}
  .search input:focus{border-color:var(--acc);background:var(--panel2)}
  .search .ic{position:absolute;left:13px;top:11px;color:var(--mut);font-size:17px}
  #chats{flex:1;overflow-y:auto;padding:4px 8px 20px}
  .row{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:17px;cursor:pointer;transition:.15s}
  .row:active{background:var(--panel);transform:scale(.985)}
  .ava{width:53px;height:53px;border-radius:17px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px;box-shadow:var(--sh);position:relative;overflow:hidden;background-size:cover;background-position:center}
  .ava .dot{position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;background:var(--ok);border:3px solid var(--bg)}
  .mid{flex:1;min-width:0}
  .rtop{display:flex;align-items:center;gap:6px}
  .nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;letter-spacing:-.3px}
  .tm{font-size:11.5px;color:var(--mut);flex:none;font-weight:600}
  .prev{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;display:flex;align-items:center;gap:6px;font-weight:500}
  .prev .me{color:var(--acc2);font-weight:700}
  .badge-un{background:var(--grad);color:#fff;border-radius:12px;min-width:22px;height:22px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;box-shadow:var(--shacc);animation:pop .3s}
  .geo-chip{font-size:10.5px;color:var(--acc2);background:color-mix(in srgb,var(--acc) 13%,transparent);padding:2px 8px;border-radius:9px;font-weight:700}
  .empty{padding:60px 24px;text-align:center;color:var(--mut);font-size:14px;line-height:1.6}
  .load{padding:44px;text-align:center;color:var(--mut)}
  .load .sp{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
  /* ---------- ДИАЛОГ ---------- */
  #conv{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:10;transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1)}
  #conv.open{transform:none}
  .hd-btn.aon{background:var(--grad);color:#fff;box-shadow:var(--shacc)}
  /* reply/forward */
  .reply-bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--panel);border-top:1px solid var(--line);border-left:3px solid var(--acc)}
  .reply-bar .rq{flex:1;min-width:0}.reply-bar .rq b{font-size:12px;color:var(--acc2)}.reply-bar .rq div{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reply-bar .x{font-size:20px;color:var(--mut);cursor:pointer;padding:0 4px}
  .b .quoted{border-left:3px solid rgba(255,255,255,.5);padding:3px 8px;margin-bottom:5px;border-radius:6px;background:rgba(0,0,0,.16);font-size:13px;opacity:.85}
  .b.in .quoted{border-left-color:var(--acc)}
  .msgmenu-bd{position:fixed;inset:0;z-index:45}
  .msgmenu{position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden;min-width:170px}
  .msgmenu div{padding:12px 16px;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600}
  .msgmenu div:active{background:var(--panel)}
  .msgmenu .ic{font-size:17px;color:var(--acc2)}
  .chd{display:flex;align-items:center;gap:11px;padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);z-index:3}
  .back{font-size:22px;color:var(--acc);cursor:pointer;padding:2px 5px;display:grid;place-items:center}
  .chd .ava{width:43px;height:43px;font-size:15px;border-radius:14px}
  .chd .nm{font-weight:700;font-size:16px;letter-spacing:-.3px}
  .chd .st{font-size:12px;color:var(--mut);margin-top:1px;display:flex;align-items:center;gap:5px;font-weight:500}
  .chd .st .ai-on{color:var(--acc2);font-weight:700}
  .hd-btn{width:41px;height:41px;border-radius:13px;display:grid;place-items:center;font-size:19px;cursor:pointer;color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent);transition:.15s;flex:none}
  .hd-btn:active{transform:scale(.9);background:color-mix(in srgb,var(--acc) 20%,transparent)}
  #body{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:3px}
  .day{align-self:center;background:var(--panel2);color:var(--mut);font-size:11.5px;padding:4px 12px;border-radius:11px;margin:8px 0;font-weight:700;box-shadow:var(--sh)}
  .b{max-width:82%;padding:8px 12px 6px;border-radius:19px;font-size:14.7px;word-wrap:break-word;position:relative;animation:bubble .25s cubic-bezier(.22,1,.36,1);line-height:1.4;font-weight:500}
  .b.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:6px}
  .b.out{align-self:flex-end;background:var(--out);border-bottom-right-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}   /* нейтральная мягкая тень (было синее неон-свечение) */
  .b img,.b video{max-width:min(260px,72vw);border-radius:14px;display:block;margin:-2px -4px 5px;cursor:pointer}
  .b .doc{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:5px 2px}
  .b .doc .ic{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.16);font-size:18px;flex:none}
  .bm{font-size:10.5px;color:var(--mut);text-align:right;margin-top:2px;display:flex;align-items:center;gap:4px;justify-content:flex-end;font-weight:600}
  .b.out .bm{color:rgba(255,255,255,.62)}
  .bm .ic{font-size:13px}.bm .ic.read{color:#8fd3ff}
  .typing{align-self:flex-start;background:var(--in);border-radius:19px;border-bottom-left-radius:6px;padding:13px 16px;display:flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:td 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  /* voice player */
  .vp{display:flex;align-items:center;gap:11px;min-width:196px;padding:2px 0}
  .vp .pp{width:39px;height:39px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:16px;cursor:pointer;flex:none;transition:.15s;color:#fff}
  .b.in .vp .pp{background:var(--grad)}
  .vp .pp:active{transform:scale(.9)}
  .vp .wave{flex:1;height:27px;display:flex;align-items:center;gap:2px;cursor:pointer}
  .vp .wave i{flex:1;background:rgba(255,255,255,.3);border-radius:2px;min-height:4px}
  .b.in .vp .wave i{background:rgba(255,255,255,.24)}
  .vp .wave i.on{background:#fff}
  .vp .meta{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .vp .sp{font-size:10.5px;font-weight:800;background:rgba(255,255,255,.24);padding:2px 8px;border-radius:9px;cursor:pointer;color:#fff}
  .vp .dur{font-size:10.5px;color:rgba(255,255,255,.66);font-weight:600}
  .b.in .vp .dur{color:var(--mut)}
  /* ---------- COMPOSER ---------- */
  .quick{display:flex;gap:7px;overflow-x:auto;padding:8px 12px 3px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .qchip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12.5px;padding:7px 13px;border-radius:13px;cursor:pointer;transition:.15s;flex:none;font-weight:600}
  .qchip:active{background:var(--panel2);transform:scale(.95)}
  .composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
  .composer textarea{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:21px;padding:10px 16px;font-size:15px;resize:none;max-height:170px;outline:none;font-family:inherit;transition:border-color .2s;line-height:1.38;font-weight:500}
  .composer textarea:focus{border-color:var(--acc)}
  .composer.has-text textarea{border-radius:18px;padding:11px 16px}
  /* многострочный текст (после диктовки) → поле на всю ширину сверху, кнопки строкой снизу */
  .composer.expanded{flex-wrap:wrap;justify-content:flex-end;gap:8px}
  .composer.expanded textarea{flex:1 0 100%;order:-1;max-height:200px}
  /* при наборе второстепенные кнопки плавно сворачиваются — поле остаётся широким */
  .cbtn.collapsible{transition:width .26s cubic-bezier(.22,1,.36,1),min-width .26s,opacity .18s,margin .26s,transform .2s,padding .26s}
  .composer.has-text .cbtn.collapsible{width:0;min-width:0;padding:0;opacity:0;margin-left:-8px;pointer-events:none;transform:scale(.4);overflow:hidden}
  .cbtn{width:45px;height:45px;border-radius:50%;border:none;background:var(--grad);color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shacc);transition:.15s}
  .cbtn:active{transform:scale(.87)}
  .cbtn.ghost{background:var(--panel);color:var(--mut);box-shadow:none;width:41px;height:41px;font-size:21px}
  .cbtn.ghost:active{background:var(--panel2)}
  .cbtn.rec{background:var(--danger);animation:pulse 1.1s infinite}
  .recbar{display:flex;align-items:center;gap:12px;flex:1;background:var(--panel);border-radius:21px;padding:10px 16px;border:1px solid rgba(255,91,82,.4)}
  .recbar .rd{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;flex:none}
  .recbar .rt{font-variant-numeric:tabular-nums;font-weight:700}
  .recbar .cancel{margin-left:auto;color:var(--danger);font-size:13px;font-weight:700;cursor:pointer}
  /* sheet */
  .sheet-bd{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:40;opacity:0;transition:.2s;display:flex;align-items:flex-end}
  .sheet-bd.on{opacity:1}
  .sheet{width:100%;max-width:680px;margin:0 auto;background:var(--panel2);border-radius:24px 24px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-bottom:0}
  .sheet-bd.on .sheet{transform:none}
  .sheet .grip{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
  .sheet h3{margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:-.3px}
  .sheet-opt{padding:13px 14px;border-radius:14px;background:var(--panel);margin-bottom:8px;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:13px;transition:.15s;font-weight:600}
  .sheet-opt:active{background:var(--bg);transform:scale(.98)}
  .sheet-opt .ic{width:42px;height:42px;border-radius:12px;background:var(--grad);color:#fff;font-size:19px;flex:none;box-shadow:var(--shacc)}
  .sheet-opt small{display:block;color:var(--mut);font-size:12px;margin-top:2px;font-weight:500}
  .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 82px);left:50%;transform:translateX(-50%) translateY(10px);background:rgba(17,26,43,.97);color:#fff;padding:11px 18px;border-radius:15px;font-size:13.5px;z-index:60;max-width:88%;box-shadow:var(--sh);opacity:0;transition:.25s;border:1px solid var(--line);text-align:center;font-weight:600}
  .toast.on{opacity:1;transform:translateX(-50%)}
  /* настройки оформления */
  .set-lbl{font-size:11.5px;color:var(--mut);font-weight:800;margin:14px 2px 9px;text-transform:uppercase;letter-spacing:.06em}
  .seg{display:flex;gap:6px;background:var(--panel);border-radius:14px;padding:5px}
  .seg button{flex:1;border:none;background:transparent;color:var(--mut);font-family:inherit;font-weight:700;font-size:13px;padding:10px 6px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s}
  .seg button .ic{font-size:18px}
  .seg button.on{background:var(--grad);color:#fff;box-shadow:var(--shacc)}
  .acc-row{display:flex;gap:13px;padding:2px}
  .acc-sw{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s;box-shadow:var(--sh)}
  .acc-sw.on{border-color:var(--ink);transform:scale(1.08)}
  /* премиум-стили CRM — свотчи (фон-плашка + бренд-точка) */
  .style-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .style-sw{border:1.5px solid var(--line);background:var(--panel);color:var(--mut);font-family:inherit;font-weight:700;font-size:11.5px;padding:9px 4px 8px;border-radius:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.15s}
  .style-sw .sw2{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
  .style-sw .sw2 i{width:13px;height:13px;border-radius:50%}
  .style-sw.on{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
  /* карточка лида */
  #leadcard{position:absolute;inset:0;z-index:20;background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);overflow-y:auto;display:flex;flex-direction:column}
  #leadcard.open{transform:none}
  .lcd-hd{display:flex;align-items:center;gap:11px;padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  .lcd-body{padding:16px 14px 34px}
  .lcd-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 0 18px}
  .lcd-top .ava{width:76px;height:76px;border-radius:24px;font-size:27px}
  .lcd-nm{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .lcd-ph{color:var(--mut);font-size:13.5px;font-weight:600}
  .lcd-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:3px}
  .lcd-stage{background:var(--grad);color:#fff;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:11px;box-shadow:var(--shacc)}
  .lcd-sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:12px;box-shadow:var(--sh)}
  .lcd-sec h4{margin:0 0 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .lcd-ax{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .lcd-ax:last-child{border-bottom:none}
  .lcd-ax .k{color:var(--mut);font-weight:600}.lcd-ax .v{font-weight:700}.lcd-ax .v.empty{color:var(--mut);font-weight:500}
  .lcd-tag{background:var(--panel2);color:var(--ink);font-size:12px;padding:4px 10px;border-radius:10px;font-weight:700}
  .lcd-sum{font-size:14px;line-height:1.55}
  .lcd-ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .lcd-ev:last-child{border-bottom:none}
  .lcd-ev .t{color:var(--mut);font-size:11px;flex:none;width:70px;font-weight:600}
  .lcd-sec h4 .lcd-edit{float:right;color:var(--acc);cursor:pointer;margin-top:-2px}.lcd-edit svg{width:15px;height:15px}
  .lcd-chips{display:flex;gap:7px;flex-wrap:wrap}
  .lcd-chip{border:1.5px solid var(--line);background:var(--panel2);color:var(--mut);font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:12px;cursor:pointer;transition:.15s}
  .lcd-chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
  .lcd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:12px;box-shadow:var(--sh)}
  .lcd-rl b{font-size:14.5px;font-weight:700;display:block}.lcd-rl small{color:var(--mut);font-size:12px}
  .lcd-sw{width:48px;height:28px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
  .lcd-sw::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
  .lcd-sw.on{background:var(--grad);border-color:transparent}.lcd-sw.on::after{transform:translateX(20px)}
  .lcd-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .lcd-acts button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-weight:700;font-size:11.5px;padding:12px 4px;border-radius:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh);transition:.15s}
  .lcd-acts button:active{transform:scale(.94)}
  .lcd-acts button .ic svg{width:21px;height:21px;color:var(--acc)}
  .lcd-next{font-size:14px;line-height:1.5;cursor:pointer;font-weight:600}.lcd-next.empty{color:var(--mut);font-weight:500}
  .lcd-ax{cursor:pointer}.lcd-ax .v.empty{color:var(--acc);font-weight:600}
  .ish{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-family:inherit;font-size:15px;padding:12px 14px;border-radius:13px;margin-bottom:12px;resize:none}
  .ish:focus{outline:none;border-color:var(--acc)}
  .ish-ok{width:100%;border:none;background:var(--grad);color:#fff;font-family:inherit;font-weight:800;font-size:15px;padding:13px;border-radius:13px;cursor:pointer;box-shadow:var(--shacc)}
  .ms-ch{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--mut);font-weight:600;margin:4px 2px 14px}.ms-ch input{width:18px;height:18px;accent-color:var(--acc)}
  /* панель фильтров чатов — горизонтальный скролл чипов (быстрые + по стадиям + по гео) */
  .segflt{display:flex;gap:7px;margin-top:11px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:3px 1px 5px;-webkit-overflow-scrolling:touch}
  .segflt::-webkit-scrollbar{height:0}
  .segflt button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
  .segflt button.on{background:var(--grad);color:#fff;border-color:transparent}   /* без тени: overflow-x резал её → «обрезка/чёрное свечение» у «Все» */
  .segflt .cnt{background:rgba(255,255,255,.22);color:inherit;font-size:11px;font-weight:800;padding:0 6px;border-radius:8px;min-width:16px;text-align:center}
  .segflt button:not(.on) .cnt{background:var(--panel2);color:var(--mut)}
  .segflt .fdot{width:8px;height:8px;border-radius:50%;flex:none}
  .segflt .fsep{flex:0 0 1px;align-self:stretch;background:var(--line);margin:4px 2px}
  /* переключатель разделов (пульт брокера): Чаты · Лиды · Задачи · Встречи */
  .viewseg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px;margin-top:2px;overflow-x:auto;scrollbar-width:none}
  .viewseg::-webkit-scrollbar{height:0}
  .viewseg button{flex:1 0 auto;border:none;background:transparent;color:var(--mut);font-family:inherit;font-weight:700;font-size:13px;padding:8px 11px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;white-space:nowrap}
  .viewseg button.on{background:var(--grad);color:#fff}   /* без тени — overflow-x резал её */
  .viewseg .ic svg{width:16px;height:16px}
  .viewseg .vbadge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 42%,transparent);color:#fff;line-height:1}
  .viewseg .vbadge.warn{background:var(--danger)}
  .viewseg .vbadge.show{display:inline-flex}
  .viewseg button.on .vbadge{background:rgba(255,255,255,.28)!important}
  /* группы лидов по стадии */
  #leads{flex:1;overflow-y:auto;padding:4px 8px 24px}
  .lgrp{margin:2px 0 10px}
  .lgrp-h{display:flex;align-items:center;gap:9px;padding:11px 10px 7px;cursor:pointer;user-select:none}
  .lgrp-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 16%,transparent)}
  .lgrp-nm{font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--ink)}
  .lgrp-c{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1px 7px;min-width:20px;text-align:center}
  .lgrp-ar{margin-left:auto;color:var(--mut);transition:transform .2s}.lgrp.closed .lgrp-ar{transform:rotate(-90deg)}
  .lgrp.closed .lgrp-body{display:none}
  .lrow{display:flex;gap:11px;align-items:center;padding:11px 11px;border-radius:15px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .lrow:active{background:var(--panel);transform:scale(.99)}
  .lrow-main{flex:1;min-width:0}
  .lrow-top{display:flex;align-items:center;gap:7px}
  .lrow-nm{font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .lrow-sub{color:var(--mut);font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:500}
  .lrow-b{color:var(--ink);font-weight:700}
  .lrow-score{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
  .lrow-need{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent)}
  .lrow-ai{font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:7px;padding:1px 6px}
  /* ── Задачи ── */
  #tasks,#meets{flex:1;overflow-y:auto;padding:8px 10px 24px}
  .tkstat{display:flex;gap:8px;margin:2px 2px 12px}
  .tkstat .s{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 6px;text-align:center;box-shadow:var(--sh)}
  .tkstat .s b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
  .tkstat .s.warn b{color:var(--danger)} .tkstat .s span{font-size:10.5px;color:var(--mut);font-weight:600}
  .tkadd{display:flex;gap:8px;margin-bottom:12px}
  .tkadd input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:11px 14px;font-size:14px;outline:none;font-family:inherit}
  .tkadd input:focus{border-color:var(--acc)}
  .tkadd button{flex:none;width:46px;border:none;border-radius:13px;background:var(--grad);color:#fff;font-size:22px;cursor:pointer;box-shadow:var(--shacc)}
  .tk{display:flex;gap:11px;align-items:flex-start;padding:12px 12px;border-radius:15px;transition:.15s;border:1px solid transparent}
  .tk:active{background:var(--panel)}
  .tk-ck{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:.15s;color:transparent}
  .tk-ck svg{width:15px;height:15px}
  .tk.done .tk-ck{background:var(--acc);border-color:var(--acc);color:#fff}
  .tk-main{flex:1;min-width:0}
  .tk-t{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink)}
  .tk.done .tk-t{text-decoration:line-through;color:var(--mut);font-weight:500}
  .tk-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--mut);font-weight:600}
  .tk-lead{color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent);border-radius:7px;padding:1px 7px;cursor:pointer}
  .tk-due.over{color:var(--danger)}
  /* ── Встречи ── */
  .mt{display:flex;gap:12px;padding:13px 13px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;transition:.15s}
  .mt:active{transform:scale(.99)}
  .mt-time{flex:none;width:58px;text-align:center;border-right:1px solid var(--line);padding-right:11px}
  .mt-time b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .mt-time span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .mt-main{flex:1;min-width:0}
  .mt-nm{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--mut);font-weight:600}
  .mt-kind{background:var(--panel2);border-radius:7px;padding:1px 8px;color:var(--ink)}
  .mt-conf{color:#0e9f5b}
  .mt-join{flex:none;align-self:center;background:var(--grad);color:#fff;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:700;text-decoration:none;box-shadow:var(--shacc)}
  .daygrp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:6px 4px 9px}
  /* ── Аналитика основателя ── */
  #analytics{flex:1;overflow-y:auto;padding:8px 10px 24px}
  .an-kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .an-kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--sh)}
  .an-kpi b{display:block;font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .an-kpi span{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:4px;display:block}
  .an-kpi .dlt{font-size:11px;font-weight:800;margin-left:6px}
  .an-kpi .dlt.up{color:#0e9f5b}.an-kpi .dlt.down{color:var(--danger)}
  .an-sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:12px;box-shadow:var(--sh)}
  .an-sec h4{margin:0 0 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .an-fn{display:flex;flex-direction:column;gap:8px}
  .an-fn-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .an-fn-row .k{flex:0 0 96px;color:var(--ink);font-weight:600}
  .an-fn-bar{flex:1;height:9px;border-radius:5px;background:var(--panel2);overflow:hidden}
  .an-fn-bar i{display:block;height:100%;border-radius:5px;background:var(--grad)}
  .an-fn-row b{flex:none;font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink);min-width:26px;text-align:right}
  .an-src{display:flex;gap:9px}
  .an-src .c{flex:1;border:1px solid var(--line);border-radius:13px;padding:11px 12px}
  .an-src .c.best{border-color:color-mix(in srgb,#12b76a 40%,var(--line))}
  .an-src .c.worst{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
  .an-src .t{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
  .an-src .nm{font-size:14px;font-weight:700;color:var(--ink);margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .an-src .sub{font-size:11.5px;color:var(--mut)}
  .an-brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .an-brow:last-child{border-bottom:none}
  .an-brow .nm{flex:1;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .an-brow .n{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
  .an-brow .cv{font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
  .an-spark{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:4px}
  .an-spark i{flex:1;background:color-mix(in srgb,var(--acc) 55%,transparent);border-radius:3px 3px 0 0;min-height:2px}
  .an-spark i.now{background:var(--acc)}
  /* ── Копилка идей ── */
  #ideas{flex:1;overflow-y:auto;padding:8px 10px 24px}
  .idea{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--sh)}
  .idea-tx{font-size:14px;line-height:1.45;color:var(--ink);white-space:pre-wrap}
  .idea-b{display:flex;align-items:center;gap:8px;margin-top:8px}
  .idea-m{flex:1;font-size:11px;color:var(--mut);font-weight:600}
  .idea-x{flex:none;border:none;background:none;color:var(--mut);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
  .idea-x:hover{color:var(--danger)}
  /* ── Поп-ап «на экран Домой» ── */
  .a2hs{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4);opacity:0;transition:opacity .28s;padding:0 0 max(env(safe-area-inset-bottom),14px)}
  .a2hs.on{opacity:1}
  .a2hs-card{width:calc(100% - 24px);max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;text-align:center;box-shadow:0 24px 60px -16px rgba(0,0,0,.5);transform:translateY(30px) scale(.97);transition:transform .34s cubic-bezier(.22,1,.36,1)}
  .a2hs.on .a2hs-card{transform:none}
  .a2hs-badge{display:flex;justify-content:center;margin-bottom:14px}
  .a2hs-logo{width:60px;height:60px;border-radius:18px;background:var(--grad);display:grid;place-items:center;box-shadow:0 12px 28px -10px rgba(0,0,0,.4);animation:a2float 2.6s ease-in-out infinite}
  .a2hs-logo svg{width:30px;height:36px}
  @keyframes a2float{50%{transform:translateY(-5px)}}
  .a2hs-t{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--ink);margin-bottom:6px}
  .a2hs-d{font-size:13.5px;line-height:1.5;color:var(--mut);margin-bottom:16px}
  .a2hs-btn{width:100%;border:none;border-radius:14px;background:var(--grad);color:#fff;font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer}
  .a2hs-btn:active{transform:scale(.985)}
  .a2hs-later{width:100%;border:none;background:none;color:var(--mut);font-family:inherit;font-weight:600;font-size:13.5px;padding:12px 0 2px;cursor:pointer}
  .segflt button:not(.on) .cnt{background:var(--acc);color:#fff}
  .dot-me{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
  #dict.rec{color:#fff;background:#e5484d!important;animation:dictpulse 1.1s ease-in-out infinite}
  #dict.busy{opacity:.45;pointer-events:none}
  @keyframes dictpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 7px rgba(229,72,77,0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.5}}
  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{transform:scale(0)}}
  @keyframes bubble{from{opacity:0;transform:translateY(6px) scale(.97)}}
  @keyframes td{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
</style>
</head>
<body>
<div id="bgart"></div>
<div id="app">
  <div id="view-list">
    <div class="top">
      <h1><span class="spark ic" data-ic="chat"></span><span id="h1t">Мои чаты</span><span class="hd-btn ic" id="settingsBtn" data-ic="gear" style="margin-left:auto;color:var(--mut);background:var(--panel)"></span></h1>
      <div class="sub" id="sub">Загрузка…</div>
      <div class="viewseg" id="viewseg">
        <button data-v="chats" class="on"><span class="ic" data-ic="chat"></span>Чаты<span class="vbadge" id="vbChats"></span></button>
        <button data-v="leads"><span class="ic" data-ic="user"></span>Лиды<span class="vbadge" id="vbLeads"></span></button>
        <button data-v="tasks"><span class="ic" data-ic="check"></span>Задачи<span class="vbadge" id="vbTasks"></span></button>
        <button data-v="meets"><span class="ic" data-ic="cal"></span>Встречи<span class="vbadge" id="vbMeets"></span></button>
        <button data-v="ideas"><span class="ic" data-ic="spark"></span>Идеи</button>
      </div>
      <div class="search"><span class="ic" data-ic="search"></span><input id="q" placeholder="Поиск"></div>

/* ⌨️ ФИКС ЛАГА «поле ввода над клавиатурой»: layout-viewport не ужимается мгновенно под софт-клавиатуру,

(function(){

  var onvv=function(){ if(raf) return; raf=requestAnimationFrame(function(){raf=null;fix();}); };
  vv.addEventListener('resize',onvv); vv.addEventListener('scroll',onvv);
  window.addEventListener('orientationchange',function(){setTimeout(fix,300)});

})();

/* предикат фильтра: быстрые + по стадии (stage:key) + по гео (geo:name) */
function chatMatch(c,f){
  if(f==='all')return true;
  if(f==='mine')return c.needsMe;
  if(f==='unread')return c.unread>0;
  if(f==='ai')return c.aiOn;
  if(f==='manual')return !c.aiOn;
  if(f.slice(0,6)==='stage:')return c.stage===f.slice(6);
  if(f.slice(0,4)==='geo:')return c.geo===f.slice(4);
  return true;
}
/* динамическая панель фильтров: быстрые + чипы стадий и гео, что реально есть в чатах */
function buildChatFilters(){
  const seg=$('#segflt');if(!seg)return;const sl=seg.scrollLeft;
  const n=f=>CHATS.filter(c=>chatMatch(c,f)).length;
  const cnt=v=>v?`<span class="cnt">${v}</span>`:'';
  const on=f=>CHFILTER===f?'on':'';
  let h=`<button data-f="all" class="${on('all')}">Все</button>`
    +`<button data-f="mine" class="${on('mine')}">Нужен я${cnt(n('mine'))}</button>`
    +`<button data-f="unread" class="${on('unread')}">Непрочитанные${cnt(n('unread'))}</button>`
    +`<button data-f="ai" class="${on('ai')}">ИИ ведёт${cnt(n('ai'))}</button>`
    +`<button data-f="manual" class="${on('manual')}">Я веду${cnt(n('manual'))}</button>`;
  const stages=[...new Set(CHATS.map(c=>c.stage).filter(Boolean))].sort((a,b)=>(STG_ORDER.indexOf(a)+1||99)-(STG_ORDER.indexOf(b)+1||99));
  if(stages.length){h+='<span class="fsep"></span>';stages.forEach(st=>{const m=STG[st]||[st,'#8b93a7'],f='stage:'+st;h+=`<button data-f="${f}" class="${on(f)}"><span class="fdot" style="background:${m[1]}"></span>${esc(m[0])}${cnt(n(f))}</button>`;});}
  const geos=[...new Set(CHATS.map(c=>c.geo).filter(Boolean))].sort();
  if(geos.length){h+='<span class="fsep"></span>';geos.forEach(g=>{const f='geo:'+g;h+=`<button data-f="${f}" class="${on(f)}">${esc(g)}${cnt(n(f))}</button>`;});}
  seg.innerHTML=h;seg.scrollLeft=sl;
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{hap();CHFILTER=b.dataset.f;renderChats()});

let VPID=0;
function voicePlayer(url){
  const id='vp'+(VPID++);
  const bars=Array.from({length:22},(_,i)=>`<i style="height:${20+30*Math.abs(Math.sin(i*1.7))|0}%"></i>`).join('');
  return `<div class="vp" data-vp="${id}" data-url="${esc(url)}"><div class="pp ic fill">${svg('play')}</div><div class="wave">${bars}</div><div class="meta"><span class="sp">1×</span><span class="dur">0:00</span></div></div>`;
}
function wireVoicePlayers(root){
  root.querySelectorAll('[data-vp]').forEach(vp=>{
    if(vp._w)return;vp._w=1;
    const au=new Audio(vp.dataset.url);au.preload='metadata';
    const pp=vp.querySelector('.pp'),sp=vp.querySelector('.sp'),dur=vp.querySelector('.dur'),bars=[...vp.querySelectorAll('.wave i')];
    const speeds=[1,1.5,2];let si=0;
    au.onloadedmetadata=()=>{if(isFinite(au.duration))dur.textContent=fmtd(au.duration)};
    au.ontimeupdate=()=>{const p=au.currentTime/(au.duration||1);bars.forEach((b,i)=>b.classList.toggle('on',i/bars.length<=p));dur.textContent=fmtd(au.duration-au.currentTime||0)};
    au.onended=()=>{pp.innerHTML=svg('play');bars.forEach(b=>b.classList.remove('on'))};
    pp.onclick=()=>{hap();document.querySelectorAll('audio').forEach(a=>{if(a!==au)a.pause()});if(au.paused){au.play();pp.innerHTML=svg('pause')}else{au.pause();pp.innerHTML=svg('play')}};
    sp.onclick=()=>{hap();si=(si+1)%speeds.length;au.playbackRate=speeds[si];sp.textContent=speeds[si]+'×'};
    vp.querySelector('.wave').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*(au.duration||0)};
  });
}
function fmtd(s){s=Math.max(0,s|0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

async function loadConv(scroll){
  let d;try{d=await jget('/tgapp/api/chat/'+CUR.id)}catch(e){$('#body').innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
  CUR=Object.assign(CUR,{name:d.name,phone:d.phone,stage:d.stage,avatar:d.avatar,aiOn:d.aiOn});
  $('#cNm').textContent=d.name;$('#cSt').innerHTML=(d.aiOn?'<span class="ai-on">● ИИ ведёт</span>':'вы ведёте')+' · '+esc(d.phone||'');
  $('#cAi').classList.toggle('aon',!!d.aiOn);

  const fp=JSON.stringify((d.messages||[]).map(m=>[m.at,m.status,m.text,m.media&&m.media.url]))+'|'+(d.typing?1:0);
  if(fp===CUR._fp&&!scroll)return; CUR._fp=fp; CUR._msgs=d.messages||[];
  let lastDay='';
  $('#body').innerHTML=CUR._msgs.map((m,i)=>{
    const day=new Date(m.at).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    const sep=day!==lastDay?`<div class="day">${day}</div>`:'';lastDay=day;
    let inner='';
    let txt=m.text||'';let quoted='';
    if(txt.startsWith('↪ ')){const nl=txt.indexOf('\n');if(nl>0){quoted=`<div class="quoted">${esc(txt.slice(2,nl))}</div>`;txt=txt.slice(nl+1)}}
    if(m.media&&m.media.url){const u=esc(m.media.url),t=m.media.type;
      if(t==='image')inner=`<img src="${u}" onclick="window.open('${u}')">`;
      else if(t==='video')inner=`<video src="${u}" controls playsinline preload="metadata"></video>`;
      else if(t==='voice'||t==='audio')inner=voicePlayer(u);
      else inner=`<a class="doc" href="${u}" target="_blank"><span class="ic">${svg('doc')}</span><span>${esc(m.media.name||'файл')}</span></a>`;
    }
    if(txt)inner+=(inner?'<div style="margin-top:2px">':'')+esc(txt)+(inner?'</div>':'');
    const tick=m.dir==='out'?`<span class="ic ${m.status==='read'?'read':''}">${svg(m.status==='read'||m.status==='delivered'?'checks':'check')}</span>`:'';
    return sep+`<div class="b ${m.dir}" data-i="${i}">${quoted}${inner}<div class="bm">${tmm(m.at)} ${tick}</div></div>`;
  }).join('')||'<div class="empty">Сообщений пока нет</div>';
  if(d.typing)$('#body').insertAdjacentHTML('beforeend','<div class="typing"><i></i><i></i><i></i></div>');
  wireVoicePlayers($('#body'));wireBubbleMenu($('#body'));
  const b=$('#body');if(scroll||b.scrollHeight-b.scrollTop-b.clientHeight<160)b.scrollTop=b.scrollHeight;
}

/* 🎙️ диктовка: голос → транскрипт → ИИ причёсывает → чистый текст в поле (на правку) */
let DREC=null,DCH=[];
$('#dict').onclick=async()=>{
  if(DREC){DREC.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    DREC=new MediaRecorder(st);DCH=[];hap('medium');$('#dict').classList.add('rec');toast('Говорите… нажмите ещё раз, чтобы закончить');
    DREC.ondataavailable=ev=>DCH.push(ev.data);
    DREC.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());$('#dict').classList.remove('rec');
      const blob=new Blob(DCH,{type:(DCH[0]&&DCH[0].type)||'audio/webm'});DREC=null;
      if(!blob.size){return}
      const ext=((blob.type.split('/')[1]||'webm').split(';')[0]);
      $('#dict').classList.add('busy');toast('Распознаю и причёсываю…');
      try{
        const r=await jpost('/tgapp/api/dictate?filename=dictate.'+ext,null,{body:blob,ct:blob.type||'audio/webm'});
        const t=(r.text||'').trim();
        if(t){const cur=txt.value.trim();txt.value=cur?cur+' '+t:t;txt.dispatchEvent(new Event('input'));txt.focus();hap();toast('Готово — проверьте и отправьте')}
        else toast('Ничего не распозналось');
      }catch(e){toast(e.message)}
      $('#dict').classList.remove('busy');
    };
    DREC.start();
  }catch(e){toast('Нет доступа к микрофону')}
};

let REC=null,CHUNKS=[],recT=null,recCancel=false;
mic.onclick=async()=>{if(REC){REC.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});REC=new MediaRecorder(st);CHUNKS=[];recCancel=false;hap('medium');
    REC.ondataavailable=ev=>CHUNKS.push(ev.data);
    REC.onstop=async()=>{clearInterval(recT);restoreComposer();st.getTracks().forEach(t=>t.stop());const blob=new Blob(CHUNKS,{type:CHUNKS[0]&&CHUNKS[0].type||'audio/ogg'});REC=null;
      if(recCancel||blob.size<900)return;
      const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('webm')?'webm':'ogg';toast('Отправляю голосовое…');
      try{await jpost('/tgapp/api/chat/'+CUR.id+'/media?type=voice&filename=voice.'+ext,null,{body:blob,ct:blob.type||'audio/ogg'});await loadConv(true)}catch(e){toast('Не отправилось: '+e.message)}};
    REC.start();showRecBar()}catch(e){toast('Нет доступа к микрофону')}
};
function showRecBar(){const st=Date.now();const c=$('#composer');
  [...c.children].forEach(ch=>{ch.dataset._d=ch.style.display||'';ch.style.display='none'});
  const bar=document.createElement('div');bar.id='recbarWrap';bar.style.cssText='display:flex;align-items:center;gap:8px;flex:1';
  bar.innerHTML='<div class="recbar"><span class="rd"></span><span class="rt" id="rt">0:00</span><span class="cancel" id="rcancel">Отмена</span></div><button class="cbtn rec ic fill" id="rsend">'+svg('send')+'</button>';
  c.appendChild(bar);
  recT=setInterval(()=>{$('#rt').textContent=fmtd((Date.now()-st)/1000)},250);
  $('#rsend').onclick=()=>{hap();REC&&REC.stop()};
  $('#rcancel').onclick=()=>{recCancel=true;hap();REC&&REC.stop();toast('Запись отменена')};
}
function restoreComposer(){const c=$('#composer');const bar=$('#recbarWrap');if(bar)bar.remove();
  [...c.children].forEach(ch=>{if(ch.dataset._d!==undefined){ch.style.display=ch.dataset._d;delete ch.dataset._d}});txt.dispatchEvent(new Event('input'))}

$('#cCall').onclick=async()=>{if(!CUR)return;hap();try{const r=await fetch('/tgapp/api/chat/'+CUR.id+'/call',{method:'POST',headers:H});const j=await r.json().catch(()=>({}));

/* ── карточка лида = пульт брокера (тап по имени/аватару в шапке) ── */
const AXNM={purpose:'Цель покупки',timeline:'Срок',budget:'Бюджет',type:'Тип объекта'};
const STAGE_RU={new:'Новый',touch:'Касание',dialog:'Диалог',qualified:'Квалифицирован',handover:'У меня',viewing:'Показ',deal:'Сделка',sleeping:'Спит',lost:'Закрыт'};
const STAGE_ORDER=['new','touch','dialog','qualified','handover','viewing','deal','sleeping','lost'];
const STAGE_C={new:'#6B7A99',touch:'#7C8FE0',dialog:'#4F7DFF',qualified:'#2FA98C',handover:'#8B7BD8',viewing:'#C9922E',deal:'#129B6E',sleeping:'#97A2B5',lost:'#C77B7B'};
let LEADID=null;

/* универсальный инпут-шит (текст/дата) */
function inputSheet(title,o,cb){
  const bd=document.createElement('div');bd.className='sheet-bd';
  bd.innerHTML=`<div class="sheet"><div class="grip"></div><h3>${esc(title)}</h3>
    ${o.multiline?`<textarea class="ish" rows="3" placeholder="${esc(o.placeholder||'')}">${esc(o.value||'')}</textarea>`:`<input class="ish" type="${o.type||'text'}" placeholder="${esc(o.placeholder||'')}" value="${esc(o.value||'')}">`}
    <button class="ish-ok">${esc(o.ok||'Сохранить')}</button></div>`;
  document.body.appendChild(bd);requestAnimationFrame(()=>{bd.classList.add('on');const f=bd.querySelector('.ish');f.focus();f.setSelectionRange&&f.setSelectionRange(f.value.length,f.value.length)});
  const close=()=>{bd.classList.remove('on');setTimeout(()=>bd.remove(),260)};
  bd.onclick=e=>{if(e.target===bd)close()};
  bd.querySelector('.ish-ok').onclick=()=>{const v=bd.querySelector('.ish').value.trim();hap();close();cb(v)};
}
/* шит назначения встречи */

  const d=new Date(Date.now()+24*3600e3);d.setMinutes(0);const def=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:00`;
  const bd=document.createElement('div');bd.className='sheet-bd';
  bd.innerHTML=`<div class="sheet"><div class="grip"></div><h3>Назначить встречу</h3>
    <div class="set-lbl">Формат</div><div class="seg" id="mkind">${KINDS.map((k,i)=>`<button data-k="${k[0]}" class="${i===0?'on':''}">${k[1]}</button>`).join('')}</div>
    <div class="set-lbl">Дата и время</div><input class="ish" id="mat" type="datetime-local" value="${def}">
    <label class="ms-ch"><input type="checkbox" id="mconfirm" checked> Отправить клиенту подтверждение в WhatsApp</label>
    <button class="ish-ok" id="mok">Назначить</button></div>`;
  document.body.appendChild(bd);requestAnimationFrame(()=>bd.classList.add('on'));
  const close=()=>{bd.classList.remove('on');setTimeout(()=>bd.remove(),260)};bd.onclick=e=>{if(e.target===bd)close()};
  let kind='call';bd.querySelectorAll('#mkind button').forEach(b=>b.onclick=()=>{hap();kind=b.dataset.k;bd.querySelectorAll('#mkind button').forEach(x=>x.classList.toggle('on',x===b))});
  bd.querySelector('#mok').onclick=async()=>{const at=bd.querySelector('#mat').value;if(!at){toast('Укажите время');return}hap('medium');close();
    try{await jpost('/tgapp/api/lead/'+id+'/meeting',{kind,at:new Date(at).getTime(),confirm:bd.querySelector('#mconfirm').checked});toast('Встреча назначена'+(bd.querySelector('#mconfirm').checked?' · клиенту отправлено':''));openLeadCard(id)}catch(e){toast(e.message)}};

async function openLeadCard(id){

  lc.innerHTML=`<div class="lcd-hd"><span class="back ic" id="lcback" data-ic="back"></span><b style="font-size:16px">Карточка лида</b></div>
  <div class="lcd-body">
    <div class="lcd-top">${d.avatar?`<span class="ava" style="background-image:url('${esc(d.avatar)}');background-size:cover"></span>`:`<span class="ava" style="background:${avg(id)}">${esc(ini(d.name))}</span>`}
      <div class="lcd-nm">${esc(d.name)}</div><div class="lcd-ph">${esc(d.phone||'')}${d.geo?' · '+esc(d.geo):''}</div>
      <div class="lcd-badges">${d.broker?`<span class="lcd-tag">${esc(d.broker)}</span>`:''}${d.source?`<span class="lcd-tag">${esc(d.source)}</span>`:''}</div></div>

    <div class="lcd-row"><div class="lcd-rl"><b>ИИ ведёт диалог</b><small>автоответы клиенту в WhatsApp</small></div><span class="lcd-sw ${d.aiOn?'on':''}" id="lcdAi"></span></div>

    <div class="lcd-acts">
      <button data-a="note"><span class="ic">${svg('note')}</span><span>Заметка</span></button>
      <button data-a="meet"><span class="ic">${svg('cal')}</span><span>Встреча</span></button>
      <button data-a="call"><span class="ic">${svg('call')}</span><span>Звонок</span></button>
      <button data-a="sum"><span class="ic">${svg('spark')}</span><span>ИИ-сводка</span></button>

  lc.querySelectorAll('[data-edit="next"]').forEach(el=>el.onclick=()=>{hap();inputSheet('Следующий шаг',{placeholder:'Например: перезвонить завтра в 12:00',value:(d.nextAction&&d.nextAction.text)||''},async v=>{try{await jpost('/tgapp/api/lead/'+id+'/next',{text:v});toast(v?'Сохранено':'Очищено');openLeadCard(id)}catch(e){toast(e.message)}})});
  /* квалификация — тап по оси → редактировать */
  lc.querySelectorAll('[data-qual]').forEach(el=>el.onclick=()=>{const k=el.dataset.qual;hap();inputSheet(AXNM[k],{placeholder:k==='budget'?'Например: $300 000':'Введите значение',value:d.quals[k]||''},async v=>{try{await jpost('/tgapp/api/lead/'+id+'/qual',{key:k,value:v});toast('Сохранено');openLeadCard(id)}catch(e){toast(e.message)}})});
}
function closeLeadCard(){hap();LEADID=null;$('#leadcard').classList.remove('open');if(TG&&TG.BackButton){TG.BackButton.offClick&&TG.BackButton.offClick(closeLeadCard);if($('#conv').classList.contains('open'))TG.BackButton.onClick(closeChat)}if(MODE==='leads'&&!$('#conv').classList.contains('open'))loadLeads()}
$('#cProfile').onclick=()=>{if(CUR)openLeadCard(CUR.id)};
$('#cAva').onclick=()=>{if(CUR)openLeadCard(CUR.id)};

paintIcons();
/* ── Быстрый доступ: добавить мини-апп на экран «Домой» (Telegram Bot API 8.0+) ── */
function hideA2HS(){const el=$('#a2hs');if(!el)return;el.classList.remove('on');setTimeout(()=>el.classList.add('hidden'),320);}
function showA2HS(){const el=$('#a2hs');if(!el)return;el.classList.remove('hidden');requestAnimationFrame(()=>el.classList.add('on'));}
function initA2HS(){
  if(!TG||!TG.isVersionAtLeast||!TG.isVersionAtLeast('8.0')||!TG.addToHomeScreen)return;   /* нет нативной поддержки → не показываем */
  try{if(localStorage.getItem('lumen_a2hs_done')==='1')return;
    const sn=+localStorage.getItem('lumen_a2hs_snooze')||0; if(sn&&Date.now()-sn<3*864e5)return;   /* «позже» → не тревожим 3 дня */
  }catch(e){}
  const offer=()=>setTimeout(showA2HS,1400);
  if(TG.checkHomeScreenStatus){ try{TG.checkHomeScreenStatus(st=>{ if(st==='added'){try{localStorage.setItem('lumen_a2hs_done','1')}catch(e){}return;} if(st==='unsupported')return; offer(); });}catch(e){offer();} }
  else offer();
}
document.getElementById('a2hsAdd')&&document.getElementById('a2hsAdd').addEventListener('click',()=>{hap();try{TG&&TG.addToHomeScreen&&TG.addToHomeScreen();}catch(e){}});
document.getElementById('a2hsLater')&&document.getElementById('a2hsLater').addEventListener('click',()=>{hap();try{localStorage.setItem('lumen_a2hs_snooze',String(Date.now()))}catch(e){}hideA2HS();});
if(TG&&TG.onEvent){TG.onEvent('homeScreenAdded',()=>{try{localStorage.setItem('lumen_a2hs_done','1')}catch(e){}hideA2HS();if(window.toast)toast('Готово','Иконка добавлена на экран «Домой»');});}

if(!INIT){$('#chats').innerHTML='<div class="empty">Откройте это приложение через кнопку «Чаты» в Telegram-боте.</div>';$('#sub').textContent='—'}
else{
  fetch('/tgapp/api/prefs',{headers:H}).then(r=>r.json()).then(p=>{if(p&&(p.theme||p.accent)){PREFS=Object.assign(PREFS,p);try{localStorage.setItem(PREF_KEY,JSON.stringify(PREFS))}catch(e){}applyTheme()}}).catch(()=>{});
  applyRole().then(()=>{ if(ROLE!=='owner'){ loadChats();prefetchLeadsBadge();prefetchDayBadges(); } });
  setInterval(()=>{ if(ROLE==='owner'){ loadAnalytics(); } else if(!$('#conv').classList.contains('open')){ loadChats();prefetchLeadsBadge();prefetchDayBadges(); } },6000);
  initA2HS();
}
</script>
</body>
</html>
