<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lumen · Чаты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{ --bg:#0e1621; --panel:#17212b; --panel2:#1f2c39; --ink:#fff; --mut:#7d8b99; --line:#26333f;
    --out:#2b5278; --in:#182533; --acc:#3390ec; --ok:#4fae4e; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Roboto,Segoe UI,sans-serif;overscroll-behavior:none}
  #app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  .hidden{display:none!important}
  /* --- список чатов --- */
  .list-hd{padding:12px 14px 8px;font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .list-hd .cnt{margin-left:auto;font-size:12px;color:var(--mut);font-weight:500}
  .search{padding:8px 12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;background:var(--panel2);border:none;color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;outline:none}
  #chats{flex:1;overflow-y:auto}
  .chat-row{display:flex;gap:11px;align-items:center;padding:10px 13px;cursor:pointer;border-bottom:1px solid rgba(38,51,63,.5)}
  .chat-row:active{background:var(--panel)}
  .ava{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;font-size:16px}
  .chat-mid{flex:1;min-width:0}
  .chat-top{display:flex;align-items:center;gap:6px}
  .chat-nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .chat-tm{font-size:12px;color:var(--mut);flex:none}
  .chat-prev{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .unread{background:var(--acc);color:#fff;border-radius:11px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-left:6px}
  .empty{padding:40px 20px;text-align:center;color:var(--mut)}
  /* --- диалог --- */
  #conv{flex:1;display:flex;flex-direction:column;min-height:0}
  .conv-hd{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .back{font-size:22px;color:var(--acc);cursor:pointer;padding:2px 6px;margin-left:-4px}
  .conv-hd .ava{width:38px;height:38px;font-size:14px}
  .conv-nm{font-weight:600;font-size:15px}
  .conv-sub{font-size:12px;color:var(--mut)}
  .conv-call{margin-left:auto;font-size:20px;color:var(--acc);cursor:pointer;padding:6px}
  #body{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,#0e1621,#0b131c)}
  .b{max-width:80%;padding:7px 11px;border-radius:14px;font-size:14.5px;word-wrap:break-word;position:relative}
  .b.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:5px}
  .b.out{align-self:flex-end;background:var(--out);border-bottom-right-radius:5px}
  .b img,.b video{max-width:100%;border-radius:10px;display:block;margin-bottom:3px}
  .b audio{width:210px;height:36px;margin-bottom:2px}
  .b .doc{display:flex;align-items:center;gap:8px;color:var(--acc);text-decoration:none}
  .bm{font-size:10.5px;color:var(--mut);text-align:right;margin-top:2px}
  .b.out .bm{color:rgba(255,255,255,.55)}
  .day{align-self:center;background:rgba(0,0,0,.3);color:var(--mut);font-size:11.5px;padding:3px 10px;border-radius:10px;margin:6px 0}
  /* --- composer --- */
  .composer{display:flex;align-items:flex-end;gap:7px;padding:8px 9px;border-top:1px solid var(--line);background:var(--panel)}
  .composer textarea{flex:1;background:var(--panel2);border:none;color:var(--ink);border-radius:18px;padding:9px 13px;font-size:15px;resize:none;max-height:110px;outline:none;font-family:inherit}
  .cbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:19px;display:grid;place-items:center;cursor:pointer;flex:none}
  .cbtn.ghost{background:transparent;color:var(--mut);width:38px}
  .cbtn.rec{background:#e0483d;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .rec-hint{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:#e0483d;color:#fff;font-size:12.5px;padding:6px 14px;border-radius:14px}
  .toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:9px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:90%}
  .load{padding:36px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div id="app">
  <div id="view-list">
    <div class="list-hd">💬 Мои чаты<span class="cnt" id="listCnt"></span></div>
    <div class="search"><input id="q" placeholder="Поиск по имени или номеру"></div>
    <div id="chats"><div class="load">Загрузка…</div></div>
  </div>
  <div id="conv" class="hidden">
    <div class="conv-hd">
      <span class="back" id="back">‹</span>
      <span class="ava" id="cAva"></span>
      <div><div class="conv-nm" id="cNm"></div><div class="conv-sub" id="cSub"></div></div>
      <span class="conv-call" id="cCall" title="Позвонить">📞</span>
    </div>
    <div id="body"><div class="load">Загрузка…</div></div>
    <div class="composer">
      <button class="cbtn ghost" id="attach" title="Вложение">📎</button>
      <input type="file" id="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx" hidden>
      <textarea id="text" rows="1" placeholder="Сообщение"></textarea>
      <button class="cbtn" id="mic" title="Голосовое">🎤</button>
      <button class="cbtn hidden" id="send" title="Отправить">➤</button>
    </div>
  </div>
</div>
<script>
const TG = window.Telegram && window.Telegram.WebApp; if (TG) { TG.ready(); TG.expand(); }
const INIT = (TG && TG.initData) || '';
const H = { 'X-Tg-Init-Data': INIT };
let CHATS = [], CUR = null, POLL = null;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AVC = ['#e17076','#7bcb68','#65aadd','#a695e7','#ee7aae','#6ec9cb','#f0a05a'];
const avc = s => AVC[Math.abs([...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0))%AVC.length];
const ini = n => String(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const tmm = t => new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
async function jget(u){ const r=await fetch(u,{headers:H}); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.status); return r.json(); }

async function loadChats(){
  try{ CHATS = await jget('/tgapp/api/chats'); renderChats(); }
  catch(e){ $('#chats').innerHTML = '<div class="empty">Не удалось загрузить.<br>'+esc(e.message)+'<br><br>Откройте через кнопку бота (нужна привязка брокера).</div>'; }
}
function renderChats(){
  const q = ($('#q').value||'').toLowerCase().trim();
  const list = CHATS.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q));
  $('#listCnt').textContent = CHATS.length? CHATS.length+' чатов'+(totalUnread()?' · '+totalUnread()+' новых':'') : '';
  $('#chats').innerHTML = list.length? list.map(c=>`
    <div class="chat-row" data-id="${c.id}">
      <span class="ava" style="background:${avc(c.id)}">${esc(ini(c.name))}</span>
      <div class="chat-mid">
        <div class="chat-top"><span class="chat-nm">${esc(c.name)}</span><span class="chat-tm">${c.lastMsgAt?tmm(c.lastMsgAt):''}</span></div>
        <div class="chat-prev">${c.lastDir==='out'?'Вы: ':''}${esc(c.lastText||'нет сообщений')}</div>
      </div>
      ${c.unread>0?`<span class="unread">${c.unread>99?'99+':c.unread}</span>`:''}
    </div>`).join('') : '<div class="empty">Активных чатов нет</div>';
  document.querySelectorAll('.chat-row').forEach(r=>r.onclick=()=>openChat(r.dataset.id));
}
function totalUnread(){ return CHATS.reduce((n,c)=>n+(c.unread||0),0); }

async function openChat(id){
  CUR = CHATS.find(c=>c.id===id) || {id};
  $('#view-list').classList.add('hidden'); $('#conv').classList.remove('hidden');
  $('#cAva').style.background=avc(id); $('#cAva').textContent=ini(CUR.name);
  $('#cNm').textContent=CUR.name||''; $('#cSub').textContent=CUR.phone||'';
  if(TG&&TG.BackButton){ TG.BackButton.show(); TG.BackButton.onClick(closeChat); }
  await loadConv(true);
  clearInterval(POLL); POLL=setInterval(()=>loadConv(false),4000);
}
function closeChat(){ clearInterval(POLL); $('#conv').classList.add('hidden'); $('#view-list').classList.remove('hidden'); if(TG&&TG.BackButton)TG.BackButton.hide(); loadChats(); }
$('#back').onclick=closeChat;

async function loadConv(scroll){
  let d; try{ d=await jget('/tgapp/api/chat/'+CUR.id); }catch(e){ $('#body').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
  CUR = Object.assign(CUR, {name:d.name,phone:d.phone,stage:d.stage});
  $('#cNm').textContent=d.name; $('#cSub').textContent=(d.phone||'')+(d.stage?' · '+d.stage:'');
  let lastDay='';
  $('#body').innerHTML = (d.messages||[]).map(m=>{
    const day=new Date(m.at).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    const sep=day!==lastDay?`<div class="day">${day}</div>`:''; lastDay=day;
    let media='';
    if(m.media&&m.media.url){ const u=esc(m.media.url), t=m.media.type;
      if(t==='image') media=`<img src="${u}" loading="lazy">`;
      else if(t==='video') media=`<video src="${u}" controls playsinline preload="metadata"></video>`;
      else if(t==='voice'||t==='audio') media=`<audio src="${u}" controls preload="none"></audio>`;
      else media=`<a class="doc" href="${u}" target="_blank">📄 ${esc(m.media.name||'файл')}</a>`;
    }
    const tick=m.dir==='out'?(m.status==='read'||m.status==='delivered'?'✓✓':'✓'):'';
    return sep+`<div class="b ${m.dir}">${media}${m.text?esc(m.text):''}<div class="bm">${tmm(m.at)} ${tick}</div></div>`;
  }).join('') || '<div class="empty">Сообщений пока нет</div>';
  if(scroll){ const b=$('#body'); b.scrollTop=b.scrollHeight; }
  else { const b=$('#body'); if(b.scrollHeight-b.scrollTop-b.clientHeight<120) b.scrollTop=b.scrollHeight; }
}

/* composer */
const txt=$('#text'), send=$('#send'), mic=$('#mic');
txt.addEventListener('input',()=>{ txt.style.height='auto'; txt.style.height=Math.min(txt.scrollHeight,110)+'px'; const has=txt.value.trim(); send.classList.toggle('hidden',!has); mic.classList.toggle('hidden',!!has); });
txt.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click();} });
send.onclick=async()=>{ const t=txt.value.trim(); if(!t)return; txt.value=''; txt.style.height='auto'; send.classList.add('hidden'); mic.classList.remove('hidden');
  try{ await fetch('/tgapp/api/chat/'+CUR.id+'/text',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({text:t})}); await loadConv(true); }
  catch(e){ toast('Не отправилось: '+e.message); } };
$('#attach').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{ const f=e.target.files[0]; if(!f)return; e.target.value='';
  const type=/^image\//.test(f.type)?'image':/^video\//.test(f.type)?'video':/^audio\//.test(f.type)?'voice':'document';
  toast('Отправляю…');
  try{ await fetch('/tgapp/api/chat/'+CUR.id+'/media?type='+type+'&filename='+encodeURIComponent(f.name),{method:'POST',headers:{...H,'Content-Type':f.type||'application/octet-stream'},body:f}); await loadConv(true); }
  catch(e){ toast('Не отправилось: '+e.message); } };

/* голосовое */
let REC=null, CHUNKS=[], recHint=null;
mic.onclick=async()=>{
  if(REC){ REC.stop(); return; }
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:true});
    REC=new MediaRecorder(st); CHUNKS=[];
    REC.ondataavailable=ev=>CHUNKS.push(ev.data);
    REC.onstop=async()=>{ mic.classList.remove('rec'); if(recHint){recHint.remove();recHint=null;} st.getTracks().forEach(t=>t.stop());
      const blob=new Blob(CHUNKS,{type:CHUNKS[0]&&CHUNKS[0].type||'audio/ogg'}); REC=null;
      if(blob.size<800){ toast('Слишком коротко'); return; }
      const ext=(blob.type.includes('ogg')?'ogg':blob.type.includes('mp4')||blob.type.includes('mp4a')?'m4a':blob.type.includes('webm')?'webm':'ogg');
      toast('Отправляю голосовое…');
      try{ await fetch('/tgapp/api/chat/'+CUR.id+'/media?type=voice&filename=voice.'+ext,{method:'POST',headers:{...H,'Content-Type':blob.type||'audio/ogg'},body:blob}); await loadConv(true); }
      catch(e){ toast('Не отправилось: '+e.message); } };
    REC.start(); mic.classList.add('rec');
    recHint=document.createElement('div'); recHint.className='rec-hint'; recHint.textContent='● Запись… нажмите 🎤 чтобы отправить'; document.body.appendChild(recHint);
  }catch(e){ toast('Нет доступа к микрофону'); }
};
$('#cCall').onclick=()=>{ if(CUR&&CUR.phone){ toast('Звоним…'); window.location.href='tel:'+CUR.phone.replace(/[^\d+]/g,''); } };
$('#q').addEventListener('input',renderChats);

if(!INIT){ $('#chats').innerHTML='<div class="empty">Откройте это приложение через кнопку в Telegram-боте.</div>'; }
else { loadChats(); setInterval(()=>{ if($('#conv').classList.contains('hidden')) loadChats(); },6000); }
</script>
</body>
</html>
