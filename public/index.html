<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — AI-CRM для недвижимости</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Caveat:wght@500;700&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=246">
</head>
<body>
<!-- прелоадер: кобальтовый скайлайн (недвижимость) + дышащая искра; прячет app.js после загрузки -->
<div id="preloader">
  <video data-skyline autoplay muted loop playsinline></video>
  <script>
  /* видеофон СРАЗУ по теме из localStorage — иначе грузился дефолтный skyline-bg, потом app.js
     подменял на видео темы → видимая ДВОЙНАЯ смена фона. Карту держать в синхроне с THEME_VIDEO в app.js. */
  (function(){
    var M={light:'assets/skyline-cobalt.mp4?v=1',dark:'assets/skyline-night.mp4?v=1',mono:'assets/skyline-mono.mp4?v=1',frame:'assets/skyline-mono.mp4?v=1',warm:'assets/skyline-burgundy.mp4?v=1',emerald:'assets/skyline-glass.mp4?v=1',atelier:'assets/skyline-mono.mp4?v=1'};
    var PO={light:'assets/skyline-cobalt-poster.jpg',dark:'assets/skyline-night-poster.jpg',mono:'assets/skyline-mono-poster.jpg',frame:'assets/skyline-mono-poster.jpg',warm:'assets/skyline-burgundy-poster.jpg',emerald:'assets/skyline-glass-poster.jpg',atelier:'assets/skyline-mono-poster.jpg'};
    var t;try{t=localStorage.getItem('lumen_theme');if(!M[t])t=(localStorage.getItem('lumen_night')==='1'?'dark':'light');}catch(e){t='light';}
    if(!M[t])t='light';
    var v=document.currentScript.previousElementSibling;
    if(v&&v.hasAttribute('data-skyline')){v.setAttribute('poster',PO[t]);v.setAttribute('src',M[t]);try{v.load&&v.load();}catch(e){}}
  })();
  </script>
  <div class="pl-center">
    <img src="logo.svg" class="pl-logo" alt="">
    <div class="pl-word">LUMEN</div>
    <div class="pl-sub">REAL ESTATE CRM</div>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 100 120" aria-label="Lumen"><defs><linearGradient id="lumenNav" x1="20%" y1="8%" x2="80%" y2="95%"><stop offset="0%" stop-color="var(--logo-a)"/><stop offset="45%" stop-color="var(--logo-b)"/><stop offset="100%" stop-color="var(--logo-c)"/></linearGradient></defs><path fill="url(#lumenNav)" d="M50 0 C54.5 37 66 52 93 60 C66 68 54.5 83 50 120 C45.5 83 34 68 7 60 C34 52 45.5 37 50 0 Z"/></svg></div>
      <div class="brand-name">LUMEN<span>REAL ESTATE CRM</span></div>
    </div>

    <div class="navsearch">
      <input id="navSearch" type="text" placeholder="Поиск раздела…  ⌘K" autocomplete="off" spellcheck="false">
      <div class="navsearch-res" id="navSearchRes" hidden></div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-label">Работа</div>
      <button class="nav-item active" data-page="overview"></button>
      <button class="nav-item" data-page="control"></button>
      <button class="nav-item" data-page="feed"></button>
      <button class="nav-item" data-ws="pipeline" data-page="funnel"></button>
      <button class="nav-item" data-ws="dialogs" data-page="inbox"></button>
      <button class="nav-item" data-ws="base" data-page="properties"></button>
      <button class="nav-item" data-page="meetings"></button>
      <button class="nav-item" data-page="tasks"></button>

      <div class="nav-label">Рост</div>
      <button class="nav-item" data-ws="ads" data-page="mediaplan"></button>
      <button class="nav-item" data-page="social"></button>
      <button class="nav-item" data-ws="engine" data-page="qualifier"></button>

      <div class="nav-label">Итоги</div>
      <button class="nav-item" data-ws="analytics" data-page="analytics"></button>
      <button class="nav-item" data-page="brokers"></button>
      <button class="nav-item" data-page="hr"></button>

      <button class="nav-item nav-config" data-ws="config" data-page="settings"></button>
    </nav>

    <div class="side-foot">
      <div class="agency">
        <div class="ava" id="agencyAva">OA</div>
        <div>
          <div class="nm" id="agencyName">—</div>
          <div class="rl" id="agencyRole">агентство недвижимости</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-emblem" id="pageEmblem"></div>
      <div>
        <div class="page-title" id="pageTitle">Обзор</div>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="gsearch" id="gsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="gsInput" placeholder="Поиск лида или номера…" autocomplete="off">
        <div class="gs-results" id="gsResults"></div>
      </div>
      <div class="tb-spacer"></div>
      <div class="demo-chip" id="demoChip" style="display:none" title="Демо-режим: диалоги симулируются, время ускорено"><i></i>Демо</div>
      <button data-onboard title="Мастер настройки Lumen" style="display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid rgba(143,180,255,.3);background:rgba(37,99,235,.1);color:#5B84FF;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.7 5.1a2 2 0 001.2 1.2L20 11l-5.1 1.7a2 2 0 00-1.2 1.2L12 19l-1.7-5.1a2 2 0 00-1.2-1.2L4 11l5.1-1.7a2 2 0 001.2-1.2z"/></svg>Настройка</button>
      <button id="nightBtn" title="Ночной режим">🌙</button>
      <button class="btn btn-accent" id="newLeadBtn">Новый лид</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="app.js?v=257"></script>
<script src="onboard.js?v=12"></script>
</body>
</html>
